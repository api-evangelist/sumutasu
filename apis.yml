aid: sumutasu
name: Sumutasu
description: >-
  Sumutasu Inc. (株式会社すむたす) is a Japanese property-technology (proptech) company
  operating under the mission "a society where people can make ideal housing
  choices" (住まいの理想的な選択ができる社会に). It runs an instant real-estate buying and
  selling service for used condominiums in Japan, using data and technology to
  give homeowners a fast, transparent alternative to the traditional brokerage
  process, alongside an agent-assisted sales offering. The company is backed by
  500 Global. Its public presence is a corporate marketing website (About,
  Services, Members, News, and Careers) built on the Studio.Design no-code
  platform; no public developer platform, API, SDK, or documentation surface has
  been found.
